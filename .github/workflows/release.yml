name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r hubchat.zip hubchat
      - uses: softprops/action-gh-release@v2
        with:
          name: HubChat WordPress ${{ github.ref_name }}
          body: افزونه‌ی وردپرس هاب‌چت. فایل hubchat.zip را از «افزونه‌ها > افزودن > بارگذاری افزونه» نصب کنید.
          files: hubchat.zip
